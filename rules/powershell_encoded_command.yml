title: PowerShell Encoded Command Execution
id: 6f1b2c4e-3a7d-4d58-9b1e-2f0a8c5d7e11
status: experimental
description: Detects PowerShell launched with an encoded command (-e, -ec, -enc, -EncodedCommand). Frequent in malware loaders, also used by some management tools, so tune with parent-process allow-lists.
references:
    - https://attack.mitre.org/techniques/T1027/010/
author: Nikola Rankovic
date: 2026/10/31
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
    selection_flag:
        CommandLine|contains:
            - ' -e '
            - ' -ec '
            - ' -en '
            - ' -enc '
            - ' -enco'
            - ' -encodedcommand '
    filter_mgmt:
        ParentImage|endswith:
            - '\CcmExec.exe'
            - '\IntuneManagementExtension.exe'
    condition: selection_img and selection_flag and not filter_mgmt
falsepositives:
    - Software deployment and monitoring agents
    - Administrators wrapping scripts for remote execution
level: medium
