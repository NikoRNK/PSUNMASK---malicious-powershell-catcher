title: Office Application Spawns PowerShell
id: 0c9e4a77-51b2-4f3e-8a6d-9d3b1e2f4a22
status: experimental
description: An Office process or script host starting PowerShell is a classic initial-access chain (malicious macro, OLE, exploit, HTML smuggling).
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: Nikola Rankovic
date: 2026/10/31
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\onenote.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    selection_child:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Rare legitimate VBA automation in finance or engineering teams
level: high
